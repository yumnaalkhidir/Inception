
server {
    listen 443 ssl; // listening on post 443
    server_name yalkhidi.42.fr; //domain

    ssl_certificate /etc/nginx/ssl/certificate.crt; //TLS Certificate
    ssl_certificate_key /etc/nginx/ssl/private.key; // Provate key for certificate
    ssl_protocols TLSv1.2 TLSv1.3; //TLS Version

    root /var/www/html; //location of the website files
    index index.php index.html; //files to serve
}

