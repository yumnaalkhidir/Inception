services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx
    restart: always
    ports:
      # Host side locked to 443: nginx is the only entry point.
      # Container side follows NGINX_PORT from .env.
      - "443:${NGINX_PORT}"
    depends_on:
      - wordpress
    networks:
      - wp-network
    # Only the ports. nginx has no business reading the database variables.
    environment:
      NGINX_PORT: ${NGINX_PORT}
      WP_FPM_PORT: ${WP_FPM_PORT}
    volumes:
      - wordpress:/var/www/html:ro

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress
    restart: always
    depends_on:
      - mariadb
    networks:
      - wp-network
      - mariadb-network
    env_file: .env
    secrets:
      - db_user_pass
      - wp_admin_pass
      - wp_user_pass
    volumes:
      - wordpress:/var/www/html

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    restart: always
    networks:
      - mariadb-network
    env_file: .env
    secrets:
      - db_user_pass
      - db_root_pass
    volumes:
      - mariadb:/var/lib/mysql

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yalkhidi/data/mariadb

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yalkhidi/data/wordpress

networks:
  wp-network:
    driver: bridge
  mariadb-network:
    driver: bridge
    internal: true

secrets:
  db_user_pass:
    file: ../secrets/db_user_password.txt
  db_root_pass:
    file: ../secrets/db_root_password.txt
  wp_user_pass:
    file: ../secrets/wp_user_password.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_password.txt