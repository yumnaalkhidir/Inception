services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    pull_policy: build
    image: nginx:1.0
    restart: always
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html:ro

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    pull_policy: build
    image: wordpress:1.0
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception
    env_file: .env
    secrets:
      - db_user_pass
      - wp_admin_pass
      - wp_user_pass
    volumes:
      - wordpress:/var/www/html

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    pull_policy: build
    image: mariadb:1.0
    restart: always
    networks:
      - inception
    env_file: .env
    secrets:
      - db_user_pass
      - db_root_pass
    volumes:
      - mariadb:/var/lib/mysql

volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

networks:
  inception:
    name: inception
    driver: bridge

secrets:
  db_user_pass:
    file: ../secrets/db_user_password.txt
  db_root_pass:
    file: ../secrets/db_root_password.txt
  wp_user_pass:
    file: ../secrets/wp_user_password.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_password.txt
