services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - wp-network
    volumes:
      - wordpress:/var/www/html:ro

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    networks:
      - wp-network
      - mariadb-network
    env_file: .env
    secrets:
      - db_user_pass
    volumes:
      - wordpress:/var/www/html

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    networks:
      - mariadb-network
    env_file: .env
    secrets:
      - db_user_pass
      - db_root_pass
    volumes:
      - mariadb:/var/lib/mysql

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yalkhidi/data/mariadb

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yalkhidi/data/wordpress

networks:
  wp-network:
    driver: bridge
  mariadb-network:
    driver: bridge
    internal: true

secrets:
  db_user_pass:
    file: ../secrets/db_user_password.txt
  db_root_pass:
    file: ../secrets/db_root_password.txt